apiVersion: v1
kind: Service
metadata:
  name: loadbalancer-service
  namespace: default
spec:
  type: LoadBalancer
  selector:
    app: caddy-server
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      name: http
    - protocol: TCP
      port: 443
      targetPort: 443
      name: https
  sessionAffinity: None
