apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy-server
  namespace: default
  labels:
    app: caddy-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: caddy-server
  template:
    metadata:
      labels:
        app: caddy-server
    spec:
      containers:
      - name: caddy
        image: caddy:latest
        ports:
        - containerPort: 80
          name: http
        - containerPort: 443
          name: https
        - containerPort: 2019
          name: admin
        volumeMounts:
        - name: caddy-config
          mountPath: /etc/caddy/Caddyfile
          subPath: Caddyfile
    
      volumes:
      - name: caddy-config
        configMap:
          name: caddy-config


